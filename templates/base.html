<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Турнир{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header>
        <a href="{{ url_for('main.index') }}" class="site-title">Турнир</a>
        <button type="button" id="theme-toggle" class="theme-toggle" title="Сменить тему">
            <span id="theme-icon">🌙</span>
        </button>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer>
        <p>Турнир © 2026</p>
    </footer>

    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
